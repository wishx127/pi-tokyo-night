name: Pi compatibility

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  matrix:
    name: Pi ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            version: 0.79.0
          - label: historical
            version: 0.82.0
          - label: latest
            version: latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve Pi version
        id: pi_version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ matrix.version }}
        run: |
          if [ "$REQUESTED_VERSION" = "latest" ]; then
            version="$(npm view @earendil-works/pi-coding-agent version)"
          else
            version="$REQUESTED_VERSION"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the matrix Pi packages
        run: npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-ai@${{ steps.pi_version.outputs.version }} @earendil-works/pi-coding-agent@${{ steps.pi_version.outputs.version }} @earendil-works/pi-tui@${{ steps.pi_version.outputs.version }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:check

  smoke:
    name: Pi TUI smoke ${{ matrix.label }}
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            version: 0.79.0
          - label: latest
            version: latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Resolve Pi version
        id: pi_version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ matrix.version }}
        run: |
          if [ "$REQUESTED_VERSION" = "latest" ]; then
            version="$(npm view @earendil-works/pi-coding-agent version)"
          else
            version="$REQUESTED_VERSION"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-ai@${{ steps.pi_version.outputs.version }} @earendil-works/pi-coding-agent@${{ steps.pi_version.outputs.version }} @earendil-works/pi-tui@${{ steps.pi_version.outputs.version }}
      - run: npx --no-install pi --version
      - run: node scripts/pi-tui-smoke.mjs
        env:
          PI_COMPAT_VERSION: ${{ steps.pi_version.outputs.version }}
