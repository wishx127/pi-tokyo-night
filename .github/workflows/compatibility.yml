name: Pi compatibility

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/pi-checks.yml
    with:
      run_smoke: ${{ github.event_name != 'pull_request' }}
