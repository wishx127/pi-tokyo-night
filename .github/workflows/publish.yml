name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: minimum
            version: 0.80.5
          - label: historical
            version: 0.82.0
          - label: latest
            version: latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Resolve Pi version
        id: pi_version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ matrix.version }}
        run: |
          if [ "$REQUESTED_VERSION" = "latest" ]; then
            version="$(npm view @earendil-works/pi-coding-agent version)"
          else
            version="$REQUESTED_VERSION"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run the isolated Pi compatibility check
        run: node scripts/pi-compat-check.mjs "${{ steps.pi_version.outputs.version }}"
      - run: npm pack --dry-run

  smoke:
    name: Packed tarball TUI smoke ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: minimum
            version: 0.80.5
          - label: latest
            version: latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Resolve Pi version
        id: pi_version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ matrix.version }}
        run: |
          if [ "$REQUESTED_VERSION" = "latest" ]; then
            version="$(npm view @earendil-works/pi-coding-agent version)"
          else
            version="$REQUESTED_VERSION"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install packed tarball and run Pi TUI smoke
        run: node scripts/pi-tui-smoke.mjs
        env:
          PI_COMPAT_VERSION: ${{ steps.pi_version.outputs.version }}

  publish:
    needs: [compatibility, smoke]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Verify release metadata and Gallery media
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          git ls-files --error-unmatch assets/showcase.mp4 assets/thumbnail.png >/dev/null
          video_codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 assets/showcase.mp4)" || exit 1
          audio_streams="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 assets/showcase.mp4)" || exit 1
          test "$video_codec" = "h264"
          test -z "$audio_streams"
          python - <<'PY'
          from pathlib import Path

          data = Path("assets/showcase.mp4").read_bytes()
          boxes = {}
          offset = 0
          while offset + 8 <= len(data):
              size = int.from_bytes(data[offset:offset + 4], "big")
              box_type = data[offset + 4:offset + 8]
              header_size = 8
              if size == 1:
                  if offset + 16 > len(data):
                      raise SystemExit("Invalid extended MP4 box header")
                  size = int.from_bytes(data[offset + 8:offset + 16], "big")
                  header_size = 16
              elif size == 0:
                  size = len(data) - offset
              if size < header_size or offset + size > len(data):
                  raise SystemExit("Invalid MP4 box size")
              boxes.setdefault(box_type, offset)
              offset += size

          if b"moov" not in boxes or b"mdat" not in boxes or boxes[b"moov"] >= boxes[b"mdat"]:
              raise SystemExit("Gallery video must enable faststart")
          PY

          video_url="$(node -p "require('./package.json').pi.video")"
          image_url="$(node -p "require('./package.json').pi.image")"
          expected_video_url="https://cdn.jsdelivr.net/gh/wishx127/pi-tokyo-night@main/assets/showcase.mp4"
          expected_image_url="https://raw.githubusercontent.com/wishx127/pi-tokyo-night/main/assets/thumbnail.png"
          test "$video_url" = "$expected_video_url"
          test "$image_url" = "$expected_image_url"

          video_response="$(
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --header 'Range: bytes=0-0' \
              --output /dev/null \
              --write-out '%{http_code} %{content_type}' \
              "$video_url"
          )"
          test "$video_response" = "206 video/mp4"

          image_content_type="$(
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --head \
              --output /dev/null \
              --write-out '%{content_type}' \
              "$image_url"
          )"
          test "$image_content_type" = "image/png"
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
